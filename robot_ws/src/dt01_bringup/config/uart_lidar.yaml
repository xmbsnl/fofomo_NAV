# 蓝海激光雷达 —— 串口(UART) 连接配置
# 说明：整合 launch 默认加载本文件；frame_id 已改为 base_scan（匹配 URDF）。
bluesea_node:
  ros__parameters:
    #ROS2#
    frame_id: "base_scan"
    scan_topic: "scan"
    cloud_topic: "cloud"
    #DATA#
    dev_id: -1
    raw_bytes: 3
    output_360: true
    output_scan: true
    output_cloud2: false
    with_angle_filter: false
    min_angle: -3.1415926
    max_angle: 3.1415926
    hard_resample: false
    soft_resample: false
    with_checksum: true
    reversed: false
    min_dist: 0.1
    max_dist: 50.0
    error_circle: 3
    error_scale: 0.9
    #CONNECT#
    type: "uart"
    port: "/dev/ttyUSB1"
    baud_rate: -1
    #GET#
    uuid: -1
    #SET#
    resample_res: -1.0
    with_confidence: -1
    with_smooth: -1
    with_deshadow: -1
    alarm_msg: -1
    rpm: -1

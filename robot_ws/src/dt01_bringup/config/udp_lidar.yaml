# 蓝海激光雷达 —— 网口(UDP) 连接配置
# 说明：若雷达是网口款，把整合 launch 里 lidar_type:=udp，并按下表改 IP/端口。
bluesea_node:
  ros__parameters:
    #ROS2#
    frame_id: "base_scan"
    scan_topic: "scan"
    cloud_topic: "cloud"
    #DATA#
    dev_id: -1
    raw_bytes: 3
    output_360: true
    output_scan: true
    output_cloud2: false
    with_angle_filter: false
    min_angle: -3.1415926
    max_angle: 3.1415926
    hard_resample: false
    soft_resample: false
    with_checksum: true
    reversed: false
    min_dist: 0.25
    max_dist: 50.0
    error_circle: 3
    error_scale: 0.9
    log_enable: false
    log_path: "/tmp/ros2_log.txt"
    #CONNECT#
    type: "udp"
    lidar_ip: "192.168.158.98"
    lidar_port: 6543
    local_port: 6668
    group_ip: "224.1.2.3"
    #GET#
    uuid: -1
    #SET#
    resample_res: -1.0
    with_confidence: -1
    with_smooth: -1
    with_deshadow: -1
    alarm_msg: -1
    rpm: -1
    direction: -1
    ats: -1
    #NTP
    ntp_ip: "192.168.158.50"
    ntp_port: 5678
    ntp_enable: -1
